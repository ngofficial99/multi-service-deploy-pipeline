# Dev-only. Production uses Cloud SQL (private IP). See terraform/cloudsql.tf.
services:
  postgres:
    image: postgres:16
    environment:
      POSTGRES_USER: hanomi
      POSTGRES_PASSWORD: devpassword
      POSTGRES_DB: hanomi
    ports:
      - "5433:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
volumes:
  pgdata:
