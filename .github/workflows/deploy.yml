name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_worker:
        description: "Force build+deploy of the worker even if apps/worker didn't change (use for a manual rollback to an old SHA)."
        type: boolean
        default: false

permissions:
  contents: read
  id-token: write # required for Workload Identity Federation

env:
  REGION: asia-south1
  PROJECT: ${{ vars.GCP_PROJECT }}
  REGISTRY: asia-south1-docker.pkg.dev/${{ vars.GCP_PROJECT }}/hanomi
  STATE_BUCKET: ${{ vars.STATE_BUCKET }}
  ARTIFACT_BUCKET: ${{ vars.ARTIFACT_BUCKET }}

jobs:
  # Only deploy services whose code actually changed. In the real submodule
  # layout this maps to "which submodule pointer moved"; here it is path-based.
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.f.outputs.backend }}
      worker: ${{ steps.f.outputs.worker }}
      frontend: ${{ steps.f.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive, fetch-depth: 0 }
      - id: f
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:  ['apps/backend/**']
            worker:   ['apps/worker/**']
            frontend: ['apps/frontend/**']

  # The worker is a WINDOWS container, which can only be built on a Windows host.
  # This job builds + pushes it and outputs the immutable digest the deploy job
  # commits to deploy-state. Runs only when the worker changed (and infra exists).
  build-worker-windows:
    needs: changes
    # Build when the worker changed, OR on a manual dispatch with force_worker
    # (the rollback path: re-dispatch this workflow against an old SHA + tick
    # force_worker to rebuild that older source even though nothing "changed").
    if: ${{ vars.WIF_PROVIDER != '' && (needs.changes.outputs.worker == 'true' || (github.event_name == 'workflow_dispatch' && inputs.force_worker)) }}
    runs-on: windows-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.CI_SA }}
      - uses: google-github-actions/setup-gcloud@v3
      # windows-latest (Windows Server 2022) runs Docker with the Windows engine
      # by default (Moby) — no Docker Desktop / engine-switch needed. Just confirm
      # the daemon is reachable and that it's in Windows-container mode.
      - name: Verify Docker (Windows engine)
        shell: pwsh
        run: |
          for ($i=0; $i -lt 30; $i++) { docker version *> $null; if ($LASTEXITCODE -eq 0) { break }; Start-Sleep 3 }
          docker version --format '{{.Server.Os}}'   # expect: windows
      - name: Configure docker auth
        shell: pwsh
        run: gcloud auth configure-docker "$env:REGION-docker.pkg.dev" --quiet
      - id: build
        shell: pwsh
        run: |
          $IMG = "$env:REGISTRY/worker:$env:GITHUB_SHA"
          docker build -f apps/worker/Dockerfile.windows -t $IMG apps/worker
          if ($LASTEXITCODE -ne 0) { exit 1 }
          docker push $IMG
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $DIGEST = docker inspect --format='{{index .RepoDigests 0}}' $IMG
          "digest=$DIGEST" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

  deploy:
    needs: changes
    if: ${{ vars.WIF_PROVIDER != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }

      # Short-lived GCP credentials via OIDC — no stored service-account keys.
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.CI_SA }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: Configure docker auth
        run: gcloud auth configure-docker ${REGION}-docker.pkg.dev --quiet

      - name: Install deploy-state SSH key
        run: |
          install -m 0700 -d "$HOME/.ssh"
          printf '%s\n' "${{ secrets.STATE_REPO_DEPLOY_KEY }}" > "$HOME/.ssh/state_key"
          chmod 0600 "$HOME/.ssh/state_key"
          echo "STATE_SSH_KEY=$HOME/.ssh/state_key" >> "$GITHUB_ENV"

      # Linux services (backend, frontend) deploy via the GitOps reconciler:
      # build-once, digest-pin, commit-to-state, gate on actual.json. The worker
      # is Windows and deploys via the deploy-worker job below (self-hosted runner
      # ON the worker VM) — the standard push-CD pattern for a single Windows VM.
      - name: Rollout (backend, frontend)
        run: ./.github/scripts/rollout.sh
        env:
          DEPLOY_BACKEND: ${{ needs.changes.outputs.backend }}
          DEPLOY_FRONTEND: ${{ needs.changes.outputs.frontend }}
          DEPLOY_WORKER: "false"
          GIT_SHA: ${{ github.sha }}
          STATE_REPO: ${{ vars.STATE_REPO }}

  # Deploy the worker by running ON the worker VM via its self-hosted GitHub
  # Actions runner. This is the verified industry-standard push-CD path for a
  # single Windows VM: the runner pulls the freshly-built image and (re)runs the
  # container locally — no autonomous reconciler, no inbound access, fully
  # debuggable as a normal CI job. It captures the currently-running image as
  # last-good before pulling, health-gates the new container over a ~30s window,
  # and auto-rolls-back to last-good if the new image is unhealthy — the same
  # last-good/auto-revert behavior the Linux reconciler gives backend/frontend.
  deploy-worker:
    needs: [changes, build-worker-windows]
    # Deploy whenever a fresh image was built (worker changed OR forced rollback).
    if: ${{ (needs.changes.outputs.worker == 'true' || (github.event_name == 'workflow_dispatch' && inputs.force_worker)) && needs.build-worker-windows.result == 'success' }}
    runs-on: [self-hosted, windows, hanomi-worker]
    steps:
      - name: Pull + run the worker container (with auto-rollback)
        shell: pwsh
        env:
          IMAGE: ${{ needs.build-worker-windows.outputs.digest }}
          PROJECT: ${{ vars.GCP_PROJECT }}
        run: |
          $ErrorActionPreference = "Stop"

          # --- Capture the CURRENTLY-running image as last-good, for rollback. ---
          # The image the live container is on right now (empty on first deploy).
          $lastGood = (docker inspect -f '{{.Config.Image}}' hanomi-worker 2>$null)
          if ($LASTEXITCODE -ne 0) { $lastGood = "" }
          if ($lastGood) { Write-Host "last-good image: $lastGood" }
          else           { Write-Host "no running container yet (first deploy) — no rollback target" }

          # --- Auth Docker to Artifact Registry via the VM's metadata SA token. ---
          $reg = ($env:IMAGE -split "/")[0]
          $tok = (Invoke-RestMethod -Headers @{ "Metadata-Flavor"="Google" } `
            "http://metadata.google.internal/computeMetadata/v1/instance/service-accounts/default/token").access_token
          $tok | docker login -u oauth2accesstoken --password-stdin "https://$reg"

          # --- Fetch the worker's secret env -> a local file passed to the container. ---
          gcloud secrets versions access latest --secret=hanomi-worker-env --project $env:PROJECT |
            Out-File -Encoding ascii C:\hanomi\worker.env

          # Health check over a settle window. A crash-on-startup container is a
          # CRASH-LOOP under `--restart always`: docker keeps restarting it, so a
          # naive `State.Running` poll can catch it momentarily "true" between
          # restarts and wrongly pass. So we fail on ANY of:
          #   - container not Running at a sample (caught mid-exit), OR
          #   - RestartCount increased during the window (it's looping), OR
          #   - the start time moved (it was replaced by a restart).
          # Healthy = Running every sample AND zero restarts across the window.
          function Test-WorkerHealthy {
            $startedAt0 = docker inspect -f '{{.State.StartedAt}}' hanomi-worker 2>$null
            $rc0 = [int](docker inspect -f '{{.RestartCount}}' hanomi-worker 2>$null)
            for ($i = 0; $i -lt 6; $i++) {
              Start-Sleep -Seconds 5
              $st  = docker inspect -f '{{.State.Running}}' hanomi-worker 2>$null
              $rc  = [int](docker inspect -f '{{.RestartCount}}' hanomi-worker 2>$null)
              $sat = docker inspect -f '{{.State.StartedAt}}' hanomi-worker 2>$null
              if ($st -ne 'true') { Write-Host "unhealthy: not running at sample $i"; return $false }
              if ($rc -gt $rc0)   { Write-Host "unhealthy: crash-loop (RestartCount $rc0 -> $rc)"; return $false }
              if ($sat -ne $startedAt0) { Write-Host "unhealthy: container restarted (StartedAt moved)"; return $false }
            }
            return $true   # ran continuously, no restarts, across the full window
          }

          # Run a given image as the worker container.
          function Start-Worker($img) {
            docker rm -f hanomi-worker 2>$null | Out-Null
            # --restart always => survives reboots + crashes (with dockerd auto-start).
            docker run -d --name hanomi-worker --restart always `
              --env-file C:\hanomi\worker.env $img | Out-Null
          }

          # --- Deploy the new image. ---
          docker pull $env:IMAGE
          Start-Worker $env:IMAGE
          Write-Host "=== docker ps (new) ==="
          docker ps -a --filter name=hanomi-worker --format '{{.Names}} {{.Status}}'
          Write-Host "=== container logs (new) ==="
          docker logs hanomi-worker 2>&1 | Select-Object -Last 40

          if (Test-WorkerHealthy) {
            Write-Host "✅ worker healthy on new image: $env:IMAGE"
            exit 0
          }

          # --- New image is unhealthy: auto-rollback to last-good (Linux parity). ---
          Write-Warning "new image unhealthy — attempting rollback to last-good"
          if (-not $lastGood) {
            Write-Error "no last-good image to roll back to (first deploy failed). Worker is DOWN."
            exit 1
          }
          docker pull $lastGood
          Start-Worker $lastGood
          Write-Host "=== container logs (after rollback) ==="
          docker logs hanomi-worker 2>&1 | Select-Object -Last 40
          if (Test-WorkerHealthy) {
            # Rolled back and recovered — still FAIL the job so the bad deploy is loud,
            # but the live worker is back on the previous good image.
            Write-Error "DEPLOY FAILED: new image unhealthy; rolled back to last-good ($lastGood), which is healthy. Worker is up on the OLD version."
            exit 1
          }
          Write-Error "DEGRADED: new image unhealthy AND rollback to last-good ($lastGood) failed. Worker is DOWN — manual intervention required."
          exit 1
