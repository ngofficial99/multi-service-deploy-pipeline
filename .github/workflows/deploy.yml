name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write # required for Workload Identity Federation

env:
  REGION: asia-south1
  PROJECT: ${{ vars.GCP_PROJECT }}
  REGISTRY: asia-south1-docker.pkg.dev/${{ vars.GCP_PROJECT }}/hanomi
  STATE_BUCKET: ${{ vars.STATE_BUCKET }}
  ARTIFACT_BUCKET: ${{ vars.ARTIFACT_BUCKET }}

jobs:
  # Only deploy services whose code actually changed. In the real submodule
  # layout this maps to "which submodule pointer moved"; here it is path-based.
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.f.outputs.backend }}
      worker: ${{ steps.f.outputs.worker }}
      frontend: ${{ steps.f.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
          fetch-depth: 0
      - id: f
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:  ['apps/backend/**']
            worker:   ['apps/worker/**']
            frontend: ['apps/frontend/**']

  deploy:
    needs: changes
    runs-on: ubuntu-latest
    # Skip cleanly until the GCP infra exists and the repo Variables are set
    # (WIF_PROVIDER/CI_SA come from `terraform apply` outputs). Without this the
    # auth step errors on every push before the infrastructure is provisioned.
    if: ${{ vars.WIF_PROVIDER != '' }}
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      # Short-lived GCP credentials via OIDC — no stored service-account keys.
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.CI_SA }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: Configure docker auth
        run: gcloud auth configure-docker ${REGION}-docker.pkg.dev --quiet

      # Write the deploy-state repo's write-enabled deploy key to a file the
      # rollout script uses for SSH git auth (scoped to only that repo).
      - name: Install deploy-state SSH key
        run: |
          install -m 0700 -d "$HOME/.ssh"
          printf '%s\n' "${{ secrets.STATE_REPO_DEPLOY_KEY }}" > "$HOME/.ssh/state_key"
          chmod 0600 "$HOME/.ssh/state_key"
          echo "STATE_SSH_KEY=$HOME/.ssh/state_key" >> "$GITHUB_ENV"

      # Build-once, digest-pin, commit-to-state, then gate on actual.json.
      # Order enforces backend -> worker -> frontend; a failed gate halts the
      # rollout (later services are never touched).
      - name: Rollout
        run: ./.github/scripts/rollout.sh
        env:
          DEPLOY_BACKEND: ${{ needs.changes.outputs.backend }}
          DEPLOY_WORKER: ${{ needs.changes.outputs.worker }}
          DEPLOY_FRONTEND: ${{ needs.changes.outputs.frontend }}
          GIT_SHA: ${{ github.sha }}
          STATE_REPO: ${{ vars.STATE_REPO }}
