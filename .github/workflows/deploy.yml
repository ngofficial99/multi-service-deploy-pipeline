name: deploy

on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  id-token: write # required for Workload Identity Federation

env:
  REGION: asia-south1
  PROJECT: ${{ vars.GCP_PROJECT }}
  REGISTRY: asia-south1-docker.pkg.dev/${{ vars.GCP_PROJECT }}/hanomi
  STATE_BUCKET: ${{ vars.STATE_BUCKET }}
  ARTIFACT_BUCKET: ${{ vars.ARTIFACT_BUCKET }}

jobs:
  # Only deploy services whose code actually changed. In the real submodule
  # layout this maps to "which submodule pointer moved"; here it is path-based.
  changes:
    runs-on: ubuntu-latest
    outputs:
      backend: ${{ steps.f.outputs.backend }}
      worker: ${{ steps.f.outputs.worker }}
      frontend: ${{ steps.f.outputs.frontend }}
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive, fetch-depth: 0 }
      - id: f
        uses: dorny/paths-filter@v3
        with:
          filters: |
            backend:  ['apps/backend/**']
            worker:   ['apps/worker/**']
            frontend: ['apps/frontend/**']

  # The worker is a WINDOWS container, which can only be built on a Windows host.
  # This job builds + pushes it and outputs the immutable digest the deploy job
  # commits to deploy-state. Runs only when the worker changed (and infra exists).
  build-worker-windows:
    needs: changes
    if: ${{ vars.WIF_PROVIDER != '' && needs.changes.outputs.worker == 'true' }}
    runs-on: windows-latest
    outputs:
      digest: ${{ steps.build.outputs.digest }}
    steps:
      - uses: actions/checkout@v4
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.CI_SA }}
      - uses: google-github-actions/setup-gcloud@v3
      # windows-latest (Windows Server 2022) runs Docker with the Windows engine
      # by default (Moby) — no Docker Desktop / engine-switch needed. Just confirm
      # the daemon is reachable and that it's in Windows-container mode.
      - name: Verify Docker (Windows engine)
        shell: pwsh
        run: |
          for ($i=0; $i -lt 30; $i++) { docker version *> $null; if ($LASTEXITCODE -eq 0) { break }; Start-Sleep 3 }
          docker version --format '{{.Server.Os}}'   # expect: windows
      - name: Configure docker auth
        shell: pwsh
        run: gcloud auth configure-docker "$env:REGION-docker.pkg.dev" --quiet
      - id: build
        shell: pwsh
        run: |
          $IMG = "$env:REGISTRY/worker:$env:GITHUB_SHA"
          docker build -f apps/worker/Dockerfile.windows -t $IMG apps/worker
          if ($LASTEXITCODE -ne 0) { exit 1 }
          docker push $IMG
          if ($LASTEXITCODE -ne 0) { exit 1 }
          $DIGEST = docker inspect --format='{{index .RepoDigests 0}}' $IMG
          "digest=$DIGEST" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

  deploy:
    needs: changes
    if: ${{ vars.WIF_PROVIDER != '' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with: { submodules: recursive }

      # Short-lived GCP credentials via OIDC — no stored service-account keys.
      - id: auth
        uses: google-github-actions/auth@v2
        with:
          workload_identity_provider: ${{ vars.WIF_PROVIDER }}
          service_account: ${{ vars.CI_SA }}

      - uses: google-github-actions/setup-gcloud@v3

      - name: Configure docker auth
        run: gcloud auth configure-docker ${REGION}-docker.pkg.dev --quiet

      - name: Install deploy-state SSH key
        run: |
          install -m 0700 -d "$HOME/.ssh"
          printf '%s\n' "${{ secrets.STATE_REPO_DEPLOY_KEY }}" > "$HOME/.ssh/state_key"
          chmod 0600 "$HOME/.ssh/state_key"
          echo "STATE_SSH_KEY=$HOME/.ssh/state_key" >> "$GITHUB_ENV"

      # Linux services (backend, frontend) deploy via the GitOps reconciler:
      # build-once, digest-pin, commit-to-state, gate on actual.json. The worker
      # is Windows and deploys via the deploy-worker job below (self-hosted runner
      # ON the worker VM) — the standard push-CD pattern for a single Windows VM.
      - name: Rollout (backend, frontend)
        run: ./.github/scripts/rollout.sh
        env:
          DEPLOY_BACKEND: ${{ needs.changes.outputs.backend }}
          DEPLOY_FRONTEND: ${{ needs.changes.outputs.frontend }}
          DEPLOY_WORKER: "false"
          GIT_SHA: ${{ github.sha }}
          STATE_REPO: ${{ vars.STATE_REPO }}

  # Deploy the worker by running ON the worker VM via its self-hosted GitHub
  # Actions runner. This is the verified industry-standard push-CD path for a
  # single Windows VM: the runner pulls the freshly-built image and (re)runs the
  # container locally — no autonomous reconciler, no inbound access, fully
  # debuggable as a normal CI job.
  deploy-worker:
    needs: [changes, build-worker-windows]
    if: ${{ needs.changes.outputs.worker == 'true' && needs.build-worker-windows.result == 'success' }}
    runs-on: [self-hosted, windows, hanomi-worker]
    steps:
      - name: Pull + run the worker container
        shell: pwsh
        env:
          IMAGE: ${{ needs.build-worker-windows.outputs.digest }}
          PROJECT: ${{ vars.GCP_PROJECT }}
        run: |
          $ErrorActionPreference = "Stop"
          # Auth Docker to Artifact Registry via the VM's metadata SA token.
          $reg = ($env:IMAGE -split "/")[0]
          $tok = (Invoke-RestMethod -Headers @{ "Metadata-Flavor"="Google" } `
            "http://metadata.google.internal/computeMetadata/v1/instance/service-accounts/default/token").access_token
          $tok | docker login -u oauth2accesstoken --password-stdin "https://$reg"
          # Fetch the worker's secret env -> a local file passed to the container.
          gcloud secrets versions access latest --secret=hanomi-worker-env --project $env:PROJECT |
            Out-File -Encoding ascii C:\hanomi\worker.env
          docker pull $env:IMAGE
          docker rm -f hanomi-worker 2>$null
          # --restart always => survives reboots + crashes (with dockerd auto-start).
          docker run -d --name hanomi-worker --restart always --env-file C:\hanomi\worker.env $env:IMAGE
          Start-Sleep -Seconds 15
          Write-Host "=== docker ps ==="
          docker ps -a --filter name=hanomi-worker --format '{{.Names}} {{.Status}}'
          Write-Host "=== container logs ==="
          docker logs hanomi-worker 2>&1 | Select-Object -Last 40
          # Health-gate: fail the deploy if the worker isn't actually running.
          $st = docker inspect -f '{{.State.Running}}' hanomi-worker 2>$null
          if ($st -ne 'true') { Write-Error "worker container is not running (State.Running=$st)"; exit 1 }
